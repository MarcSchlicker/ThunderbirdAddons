<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Kalender anpassen</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <form id="settings-form">
      <header>
        <img src="../icons/calendar-focus.svg" alt="">
        <div>
          <h1>Kalender Raster</h1>
          <p>Eigener Tab in der linken Leiste</p>
        </div>
      </header>

      <p class="hint">
        Links in Thunderbirds Spaces-Leiste erscheint ein neuer Eintrag <strong>Kalender</strong>.
        Falls er nicht sichtbar ist, oeffne ihn hier einmal direkt.
      </p>

      <button id="open" type="button">Kalender oeffnen</button>
    </form>

    <script src="../space/i18n.js"></script>
    <script src="popup.js"></script>
  <script src="../diagnostics/runtime.js"></script><script src="../diagnostics/launcher.js"></script>
</body>
</html>
